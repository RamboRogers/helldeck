[package]
name = "helldeck"
version = "0.1.0"
edition = "2024"
authors = ["Matthew Rogers"]
description = "A Stream Deck stratagem panel for Helldivers 2 by Matthew Rogers (@matthewrogers)."

[dependencies]
anyhow = "1"
hidapi = "2.6"
elgato-streamdeck = "0.14"
evdev = "0.13"
font8x8 = "0.3"
image = {version="0.25", default-features=false, features=["png","jpeg"]}
serde = {version="1", features=["derive"]}
serde_json = "1"
ctrlc = {version="3", features=["termination"]}
tempfile = "3"
fs2 = "0.4"
ksni = { version = "0.3.7", features = ["blocking"] }

